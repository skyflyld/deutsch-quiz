<style>
/* ===== RESET & ROOT ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f4f6;--surface:#fff;--text:#1f2937;--text2:#6b7280;--text3:#9ca3af;
  --accent:#2563eb;--accent2:#1d4ed8;--accent-light:rgba(37,99,235,.08);
  --danger:#dc2626;--danger-light:#fef2f2;--success:#16a34a;--success-light:#f0fdf4;
  --warn:#f59e0b;--border:#e5e7eb;--border-light:#f3f4f6;
  --radius-sm:8px;--radius:12px;--radius-lg:20px;--radius-xl:24px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 4px 6px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.04);
  --mode-dec:#2563eb;--mode-dec-light:rgba(37,99,235,.1);
  --mode-cnd:#059669;--mode-cnd-light:rgba(5,150,105,.1);
  --mode-art:#d97706;--mode-art-light:rgba(217,119,6,.1);
  --mod1:#e11d48;--mod1-light:rgba(225,29,72,.1);
  --mod2:#059669;--mod2-light:rgba(5,150,105,.1);
  --mod3:#2563eb;--mod3-light:rgba(37,99,235,.1);
  --mod4:#7c3aed;--mod4-light:rgba(124,58,237,.1);
}
html{height:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','HarmonyOS Sans','Noto Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none;
  padding:max(env(safe-area-inset-top,0px),8px) 0 env(safe-area-inset-bottom,0px)
}

/* ===== LAYOUT ===== */
.container{max-width:480px;margin:0 auto;padding:0 14px calc(88px + env(safe-area-inset-bottom,0px));width:100%;overflow:hidden}
header{text-align:center;padding:18px 0 6px}
header h1{font-size:clamp(1.25rem,6vw,1.6rem);font-weight:900;letter-spacing:-.03em}
header p{color:var(--text2);font-size:clamp(.72rem,3.2vw,.82rem);margin-top:3px;font-weight:500}

/* ===== SECTION DIVIDERS ===== */
.section-divider{height:1px;background:var(--border);margin:10px 0 10px;opacity:.5}

/* ===== SECTION LABELS ===== */
.section-label{font-size:clamp(.68rem,2.8vw,.74rem);color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}

/* ===== STATS BAR ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px;min-width:0}
.stat{background:var(--surface);border-radius:var(--radius);padding:12px 4px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border-light);min-width:0;overflow:hidden}
.stat-value{font-size:clamp(1.1rem,5.5vw,1.4rem);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-label{font-size:clamp(.6rem,2.4vw,.68rem);color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;font-weight:600}
.stat-value.streak{color:var(--warn)}

/* ===== MODE TABS ===== */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 14px;min-width:0}
.tab{
  padding:10px 8px;border-radius:var(--radius-lg);border:1.5px solid var(--border);
  font-size:clamp(.68rem,2.8vw,.76rem);font-weight:600;cursor:pointer;
  background:var(--surface);color:var(--text2);transition:all .2s;min-height:44px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  -webkit-tap-highlight-color:transparent;user-select:none;line-height:1.25;min-width:0;overflow:hidden
}
.tab:active{transform:scale(.97);background:var(--accent-light)}
.tab.active{color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tab.active.mode-dec{background:var(--mode-dec);border-color:var(--mode-dec)}
.tab.active.mode-cnd{background:var(--mode-cnd);border-color:var(--mode-cnd)}
.tab.active.mode-art{background:var(--mode-art);border-color:var(--mode-art)}

/* ===== CONTROL PANEL ===== */
.control-panel{
  background:var(--surface);border-radius:var(--radius-xl);
  padding:clamp(10px,3.5vw,16px);margin-bottom:12px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border-light)
}

/* ===== CARDS ===== */
.card{
  background:var(--surface);border-radius:var(--radius-xl);
  padding:clamp(18px,5vw,28px);
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border-light);
  transition:all .25s ease
}

/* ===== MODULE TAGS ===== */
.module-select{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:0;min-width:0}
.module-tag{
  padding:10px 8px;border-radius:var(--radius-lg);border:1.5px solid var(--border);
  font-size:clamp(.68rem,2.8vw,.76rem);font-weight:600;cursor:pointer;
  background:var(--surface);color:var(--text2);transition:all .2s;min-height:44px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  -webkit-tap-highlight-color:transparent;user-select:none;line-height:1.25;min-width:0;overflow:hidden
}
.module-tag:active{transform:scale(.97);background:var(--accent-light)}
.module-tag.active{color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.module-tag.active.mod1{background:var(--mod1);border-color:var(--mod1)}
.module-tag.active.mod2{background:var(--mod2);border-color:var(--mod2)}
.module-tag.active.mod3{background:var(--mod3);border-color:var(--mod3)}
.module-tag.active.mod4{background:var(--mod4);border-color:var(--mod4)}

/* ===== QUESTION AREA ===== */
.q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.q-header-left{display:flex;align-items:center;gap:8px}
.question-label{font-size:clamp(.7rem,2.8vw,.76rem);color:var(--text2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.q-mode-badge{font-size:clamp(.62rem,2.5vw,.7rem);padding:4px 12px;border-radius:12px;font-weight:700;white-space:nowrap;line-height:1.4}
.q-mode-badge.mode-dec{background:var(--mode-dec-light);color:var(--mode-dec)}
.q-mode-badge.mode-cnd{background:var(--mode-cnd-light);color:var(--mode-cnd)}
.q-mode-badge.mode-art{background:var(--mode-art-light);color:var(--mode-art)}
.q-counter{font-size:clamp(.65rem,2.6vw,.74rem);color:var(--text3);white-space:nowrap;font-weight:600}
.question-word{font-size:clamp(1.5rem,7vw,2.2rem);font-weight:900;margin:14px 0;line-height:1.2;word-break:break-word;letter-spacing:-.02em}
.question-hint{font-size:clamp(.74rem,3.2vw,.84rem);color:var(--text2);margin-bottom:20px;font-weight:500}
.question-hint em{color:var(--accent);font-style:normal;font-weight:700}

/* ===== ANSWER OPTIONS ===== */
.options-wrap{display:flex;flex-direction:column;gap:8px}
.options-wrap.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.options-wrap.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.option{
  width:100%;padding:15px 14px;border-radius:var(--radius);border:2px solid var(--border);
  background:var(--surface);text-align:center;font-size:clamp(.9rem,4vw,1rem);
  cursor:pointer;transition:all .2s;min-height:52px;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;user-select:none;line-height:1.35;font-weight:500
}
.option:active{transform:scale(.985);border-color:var(--accent);background:var(--accent-light)}
.option.correct{border-color:var(--success);background:var(--success-light);transform:none}
.option.wrong{border-color:var(--danger);background:var(--danger-light);transform:none}

/* ===== FILL INPUT ===== */
.fill-input{
  width:100%;padding:15px 16px;border-radius:var(--radius);border:2px solid var(--border);
  font-size:clamp(1rem,4.5vw,1.15rem);outline:none;transition:all .2s;min-height:52px;
  -webkit-appearance:none;appearance:none;background:var(--surface);color:var(--text);
  font-family:inherit;font-weight:500
}
.fill-input::placeholder{color:var(--text3)}
.fill-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.fill-input.correct{border-color:var(--success);background:var(--success-light)}
.fill-input.wrong{border-color:var(--danger);background:var(--danger-light)}

/* ===== BUTTONS ===== */
.submit-btn{
  width:100%;margin-top:12px;padding:15px;border-radius:var(--radius);border:none;
  background:var(--accent);color:#fff;font-size:clamp(.95rem,4vw,1.05rem);
  font-weight:700;cursor:pointer;transition:all .2s;min-height:52px;
  -webkit-tap-highlight-color:transparent;letter-spacing:.01em
}
.submit-btn:active{transform:scale(.98);background:var(--accent2)}
.submit-btn:disabled{opacity:.4;cursor:default;transform:none}

/* ===== PROGRESS BAR ===== */
.progress-wrap{display:block;margin:6px 0 10px}
.progress-bar{width:100%;height:6px;border-radius:3px;background:var(--border-light);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#7c3aed);transition:width .4s ease;width:0%}
.progress-text{font-size:clamp(.6rem,2.4vw,.68rem);color:var(--text3);text-align:right;margin-top:3px;font-weight:500}

/* ===== RESET LINK ===== */
.reset-link{
  font-size:clamp(.55rem,2vw,.62rem);color:var(--text3);cursor:pointer;
  background:none;border:1px solid var(--border);border-radius:6px;
  font-family:inherit;padding:1px 8px;margin-left:10px;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;transition:all .15s
}
.reset-link:active{color:var(--danger);border-color:var(--danger)}

/* ===== FEEDBACK ===== */
.feedback{
  margin-top:14px;padding:14px 16px;border-radius:var(--radius);
  font-size:clamp(.85rem,3.5vw,.95rem);text-align:center;display:none;font-weight:600;
  animation:fadeIn .25s ease
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.feedback.show{display:block}
.feedback.correct{background:var(--success-light);color:var(--success)}
.feedback.wrong{background:var(--danger-light);color:var(--danger)}

/* ===== NEXT BUTTON (hidden — action bar handles it) ===== */
.next-btn{display:none}

/* ===== BOTTOM ACTION BAR ===== */
.action-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--surface);border-top:1px solid var(--border);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 -1px 8px rgba(0,0,0,.04)
}
@supports not ((-webkit-backdrop-filter:blur(12px)) or (backdrop-filter:blur(12px))){
  .action-bar{background:var(--surface)}
}
.action-next-btn{
  display:none;flex:2;padding:18px 24px;border-radius:var(--radius-lg);
  border:none;background:var(--accent);color:#fff;
  font-size:clamp(1.05rem,4.8vw,1.2rem);font-weight:900;cursor:pointer;
  min-height:56px;-webkit-tap-highlight-color:transparent;
  text-align:center;white-space:nowrap;letter-spacing:.03em;
  animation:pulseNext 1.5s ease-in-out infinite
}
.action-next-btn:active{background:var(--accent2);transform:scale(.98)}
.action-next-btn.show{display:block}
@keyframes pulseNext{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.4)}50%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}
.end-btn{
  flex:1;padding:18px 20px;border-radius:var(--radius-lg);
  border:none;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;
  font-size:clamp(.95rem,3.8vw,1.05rem);font-weight:800;cursor:pointer;
  text-align:center;-webkit-tap-highlight-color:transparent;min-height:56px;
  white-space:nowrap;letter-spacing:.02em;transition:all .2s;
  box-shadow:0 2px 12px rgba(245,158,11,.25)
}
.end-btn:active{background:linear-gradient(135deg,#d97706,#ea580c);box-shadow:0 1px 4px rgba(245,158,11,.15);transform:scale(.97)}

/* ===== RESULTS PAGE ===== */
.results-wrap{display:none}
.results-wrap.active{display:block;animation:slideUp .35s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.result-hero{text-align:center;padding:12px 0 8px}
.result-icon{font-size:3rem;margin-bottom:4px;line-height:1}
.result-percent{font-size:clamp(2.8rem,12vw,4rem);font-weight:900;letter-spacing:-.03em;line-height:1}
.result-detail{font-size:clamp(.78rem,3.2vw,.88rem);color:var(--text2);margin-top:6px;font-weight:500}

/* ===== RESULTS STATS ===== */
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.result-stat{
  background:var(--bg);border-radius:var(--radius);padding:16px 12px;text-align:center;
  transition:background .2s
}
.result-stat .val{font-size:clamp(1.15rem,5vw,1.5rem);font-weight:800;font-variant-numeric:tabular-nums}
.result-stat .lbl{font-size:clamp(.62rem,2.4vw,.7rem);color:var(--text3);text-transform:uppercase;margin-top:3px;font-weight:500}

/* ===== REVIEW FILTER ===== */
.review-filter{display:flex;gap:8px;margin-bottom:14px}
.review-filter button{
  flex:1;padding:10px 8px;border-radius:var(--radius-lg);border:1.5px solid var(--border);
  font-size:clamp(.72rem,2.8vw,.8rem);font-weight:600;cursor:pointer;
  background:var(--surface);color:var(--text2);transition:all .2s;
  -webkit-tap-highlight-color:transparent;min-height:44px;white-space:nowrap
}
.review-filter button:active{transform:scale(.97)}
.review-filter button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== HISTORY LIST ===== */
.history-list{
  display:flex;flex-direction:column;gap:5px;max-height:45vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;padding-right:2px
}
.history-list::-webkit-scrollbar{width:3px}
.history-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.history-item{
  display:flex;flex-direction:column;gap:3px;padding:10px 12px;
  border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface);transition:all .15s;
  flex-shrink:0;overflow:hidden
}
.history-item:active{transform:scale(.99)}
.history-item.wrong{border-color:#fecdd3;background:var(--danger-light)}
.history-item.correct{border-color:#bbf7d0;background:var(--success-light)}
.history-item .h-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1px}
.history-item .h-num{font-size:clamp(.6rem,2.2vw,.66rem);color:var(--text3);font-weight:600}
.history-item .h-mark{font-size:1.2rem;line-height:1}
.history-item .h-word{font-size:clamp(.85rem,3.8vw,.98rem);font-weight:700;line-height:1.2;word-break:break-word;overflow-wrap:break-word}
.history-item .h-meta{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;line-height:1.35}
.history-item .h-label{font-size:clamp(.7rem,2.8vw,.76rem);color:var(--text3);font-weight:500;flex-shrink:0}
.history-item .h-answer{font-size:clamp(.78rem,3.2vw,.88rem);color:var(--text2);word-break:break-word;overflow-wrap:break-word;min-width:0}
.history-item .h-answer.wrong-ans{color:var(--danger);text-decoration:line-through}
.history-item .h-correct{font-size:clamp(.72rem,2.8vw,.8rem);color:var(--success);font-weight:600;word-break:break-word;overflow-wrap:break-word;min-width:0}
.history-item .h-mark{font-size:1.35rem;flex-shrink:0;line-height:1.5}

/* ===== RESULT ACTIONS ===== */
.result-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.result-actions button{
  flex:1 1 auto;padding:14px 18px;border-radius:var(--radius-lg);
  font-size:clamp(.84rem,3.4vw,.92rem);font-weight:700;cursor:pointer;
  -webkit-tap-highlight-color:transparent;min-height:48px;white-space:nowrap;
  transition:all .2s
}
.result-actions button:active{transform:scale(.97)}
.btn-primary{border:none;background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.2)}
.btn-primary:active{background:var(--accent2);box-shadow:none}
.btn-outline{border:2px solid var(--accent);background:transparent;color:var(--accent)}
.btn-outline:active{background:var(--accent-light)}

/* ===== STATE TOGGLES ===== */
.quiz-section{display:block}
.quiz-section.hidden{display:none}

/* ===== DARK MODE ===== */
@media(prefers-color-scheme:dark){
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--text:#eee;--text2:#999;--text3:#666;
  --border:#2a2a2a;--border-light:#222;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 3px rgba(0,0,0,.5);--shadow-lg:0 4px 6px rgba(0,0,0,.5);
  --accent-light:rgba(59,130,246,.12);
  --danger-light:rgba(220,38,38,.12);--success-light:rgba(22,163,74,.12)
}
.option.correct{background:var(--success-light)}.option.wrong{background:var(--danger-light)}
.fill-input{color-scheme:dark}.fill-input.correct{background:var(--success-light)}.fill-input.wrong{background:var(--danger-light)}
.feedback.correct{background:var(--success-light)}.feedback.wrong{background:var(--danger-light)}
.history-item.wrong{background:var(--danger-light);border-color:#7f1d1d}
.history-item.correct{background:var(--success-light);border-color:#166534}
.result-stat{background:#1c1c1c}
.action-bar{background:rgba(26,26,26,.92)}
@supports not ((-webkit-backdrop-filter:blur(12px)) or (backdrop-filter:blur(12px))){
  .action-bar{background:#1a1a1a}
}
}

/* ===== RESPONSIVE BREAKPOINTS ===== */

/* --- Phone class --- */

/* iPhone SE / Galaxy S5 / small Android (320-359px) */
@media(max-width:359px){
  .container{padding:0 10px calc(84px + env(safe-area-inset-bottom,0px))}
  .stats{grid-template-columns:repeat(2,1fr);gap:5px}.stat{padding:8px 4px}.stat-value{font-size:.95rem}
  .tabs{gap:3px}.tab{font-size:.62rem;padding:10px 3px}
  .module-select{gap:5px}.module-tag{font-size:.62rem;padding:10px 5px}
  .card{padding:14px}.option{padding:13px 12px;font-size:.84rem}
  .question-word{font-size:1.2rem}
  .result-percent{font-size:2.2rem}.result-stat{padding:12px 8px}
  .q-mode-badge{font-size:.58rem;padding:2px 8px}
  header p{font-size:.68rem}
  #retryBadge{display:block!important;margin:4px 0 0!important;font-size:.6rem}
}

/* iPhone 6/7/8/SE2/12/13/14, 14 Pro, 15/16 Pro, Pixel (360-413px) */
@media(min-width:360px) and (max-width:413px){
  .container{padding:0 12px calc(86px + env(safe-area-inset-bottom,0px))}
  .stats{grid-template-columns:repeat(2,1fr);gap:6px}.stat{padding:8px 6px}.stat-value{font-size:1rem}
  .q-mode-badge{font-size:.6rem;padding:3px 8px}
}

/* iPhone 14/15/16 Plus / 16/17 Pro Max / Galaxy S24 Ultra (414-430px) */
@media(min-width:414px) and (max-width:430px){
  .card{padding:22px 24px}.stats{gap:8px}
}

/* --- Mid-size: phone landscape / iPad mini portrait / foldable unfolded (431-767px) --- */
@media(min-width:431px) and (max-width:767px){
  .container{max-width:480px;margin:0 auto;padding:0 18px calc(88px + env(safe-area-inset-bottom,0px))}
  .card{padding:26px 28px}
  .stats{gap:10px}.stat{padding:12px 6px}
  .tabs{gap:10px}
  .history-list{max-height:50vh}
  .action-bar{padding:12px max(18px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
}

/* --- Phone landscape (compact height) --- */

let currentMode = null, currentWord = null, currentOptions = [], answered = false;
let activeModes = new Set(['de-cn','cn-de','article']);
let activeModules = new Set([1,2,3,4]);
let score = 0, streak = 0, maxStreak = 0, total = 0, correct = 0;
let history = [];
let quizActive = true;
let retryPool = null;
let seenSet = new Set();

// ===== HELPERS =====
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function getPool(){
  let pool=vocab.filter(v=>activeModules.has(v.module)&&(currentMode!=='article'||v.article));
  if(retryPool) pool=pool.filter(v=>retryPool.some(r=>r.de===v.de&&r.cn===v.cn));
  return pool;
}

function getProgressPool(){
  let pool=vocab.filter(v=>activeModules.has(v.module));
  if(retryPool) pool=pool.filter(v=>retryPool.some(r=>r.de===v.de&&r.cn===v.cn));
  return pool;
}



// ===== PERSISTENCE =====
const STORAGE_KEY='deutsch-quiz-v1';

function saveState(){
  try{
    const data={score,streak,maxStreak,total,correct,history,quizActive,
      seenSet:[...seenSet],activeModes:[...activeModes],activeModules:[...activeModules],
      retryPool,isResults:document.getElementById('resultsWrap').classList.contains('active')};
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  }catch(e){}
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);if(!raw) return false;
    const data=JSON.parse(raw);if(!data) return false;
    score=data.score||0;streak=data.streak||0;maxStreak=data.maxStreak||0;
    total=data.total||0;correct=data.correct||0;history=data.history||[];
    seenSet=new Set(data.seenSet||[]);
    activeModes=new Set(data.activeModes||['de-cn','cn-de','article']);
    activeModules=new Set(data.activeModules||[1,2,3,4]);
    retryPool=data.retryPool||null;
    if(retryPool) document.getElementById('retryBadge').style.display='inline';
    updateStats();
    // Sync tab/button UI
    document.querySelectorAll('.tab').forEach(t=>{
      const mode=t.onclick?.toString().match(/'(.*?)'/)?.[1];
      if(mode) t.classList.toggle('active',activeModes.has(mode));
    });
    renderModules();
    return data.isResults===true;
  }catch(e){return false;}
}

function clearState(){
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  resetState();
}

function updateProgress(){
  const pool=getProgressPool();if(!pool.length){document.getElementById('progressWrap').style.display='none';return}
  let totalCombos=0;
  for(const v of pool){
    if(activeModes.has('de-cn')) totalCombos++;
    if(activeModes.has('cn-de')) totalCombos++;
    if(activeModes.has('article')&&v.article) totalCombos++;
  }
  const pct=totalCombos>0?Math.min(100,Math.round(seenSet.size/totalCombos*100)):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=seenSet.size+' / '+totalCombos+' 已探索';
  document.getElementById('progressWrap').style.display='block';
}

function cleanDEWord(raw){
  return raw
    .replace(/^(der|die|das)\s+/,'')
    .replace(/\s*\([^)]*\)\s*/g,'')
    .replace(/\s*\.{3}\w.*$/,'')
    .replace(/\s*\[^\]]*\]/g,'')  // 剥音标 [ˈblɔɡn̩]
    .replace(/\s*\+\S+(?:\s+\S+)?/g,'')
    .replace(/\s*¨.*$/,'')
    .replace(/\s+-[a-zäöüß]+.*$/,'')             // 剥 -e -n -en -s 复数后缀
    .replace(/\s*-\s*$/,'')
    .replace(/\s+/g,' ')
    .trim();
}

function pickWrongsDE(currentWord, n=3){
  const pool=getPool().filter(v=>v.de!==currentWord.de);
  const picked=[];const used=new Set();
  const cleanCurrent=cleanDEWord(currentWord.de);
  while(picked.length<n&&picked.length<pool.length){
    const r=pool[Math.floor(Math.random()*pool.length)];
    const clean=cleanDEWord(r.de);
    if(!used.has(clean)&&clean!==cleanCurrent){used.add(clean);picked.push(r.de)}
  }
  return picked;
}

function pickWrongs(correctWord, n=3){
  const pool = getPool().filter(v=>v.cn!==correctWord.cn);
  const picked=[]; const used=new Set();
  while(picked.length<n && picked.length<pool.length){
    const r=pool[Math.floor(Math.random()*pool.length)];
    if(!used.has(r.cn)){used.add(r.cn);picked.push(r.cn)}
  }
  return picked;
}

function addHistory(mode, word, userAns, correctAns, isCorrect){
  history.push({mode,word,userAns,correctAns,isCorrect,timestamp:Date.now()});
}

// ===== RENDER =====
function renderModules(){
  const el=document.getElementById('moduleSelect');
  const modColors={1:'mod1',2:'mod2',3:'mod3',4:'mod4'};
  const names={1:'家庭与社会',2:'自然与文化',3:'教育与职业',4:'人与沟通'};
  el.innerHTML=[1,2,3,4].map(m=>{
    const cls=activeModules.has(m)?`active ${modColors[m]}`:'';
    return `<button class="module-tag ${cls}" onclick="toggleModule(${m})">M${m} ${names[m]}</button>`;
  }).join('');
}

const modeNames={'de-cn':'DE→CN','cn-de':'CN→DE','article':'冠词'};
const modeIcons={'de-cn':'📖','cn-de':'✍️','article':'📋'};

function newQuestion(){
  if(!quizActive)return;
  answered=false;
  currentMode=pickMode();
  let pool=getPool();
  if(pool.length===0){
    document.getElementById('qWord').textContent='请至少选择一个模块';
    document.getElementById('answerArea').innerHTML='';
    document.getElementById('nextBtn').className='next-btn';
    return;
  }
  // Prefer unseen questions; reset when all seen
  const unseen=pool.filter(v=>!seenSet.has(v.de+'|'+currentMode));
  if(unseen.length>0) pool=unseen; else seenSet.clear();
  currentWord=pool[Math.floor(Math.random()*pool.length)];
  seenSet.add(currentWord.de+'|'+currentMode);

  document.getElementById('qCounter').textContent=total>0?`第 ${total+1} 题`:'第 1 题';
  const badge=document.getElementById('qModeBadge');
  badge.textContent=modeIcons[currentMode]+' '+modeNames[currentMode];
  badge.className='q-mode-badge mode-'+currentMode;

  if(currentMode==='de-cn'){
    document.getElementById('qLabel').textContent='选择中文释义';
    document.getElementById('qWord').textContent=currentWord.de;
    document.getElementById('qHint').textContent='';
    const wrongs=pickWrongs(currentWord);
    currentOptions=shuffle([currentWord.cn,...wrongs.slice(0,3)]);
    const btns=currentOptions.map((o,i)=>
      `<button class="option" onclick="answerDE_CN('${o.replace(/'/g,"\\'")}',${i})">${o}</button>`).join('');
    document.getElementById('answerArea').innerHTML=`<div class="options-wrap grid2">${btns}</div>`;
  } else if(currentMode==='cn-de'){
    document.getElementById('qLabel').textContent='选择对应的德语释义';
    document.getElementById('qWord').textContent=currentWord.cn;
    document.getElementById('qHint').textContent='';
    const correctClean=cleanDEWord(currentWord.de);
    const wrongs=pickWrongsDE(currentWord);
    const rawOptions=shuffle([currentWord.de,...wrongs.slice(0,3)]);
    currentOptions=rawOptions.map(o=>cleanDEWord(o));
    const btns=rawOptions.map((o,i)=>
      `<button class="option" onclick="answerCN_DE('${currentOptions[i].replace(/'/g,"\\'")}',${i})">${o}</button>`).join('');
    document.getElementById('answerArea').innerHTML=`<div class="options-wrap grid2">${btns}</div>`;
  } else if(currentMode==='article'){
    document.getElementById('qLabel').textContent='这个词的冠词是？';
    document.getElementById('qWord').textContent=currentWord.de.replace(/^(der|die|das)\s+/,'');
    document.getElementById('qHint').textContent='选择 der / die / das';
    const btns=['der','die','das'].map(a=>
      `<button class="option" onclick="answerArticle('${a}')">${a}</button>`).join('');
    document.getElementById('answerArea').innerHTML=`<div class="options-wrap grid3">${btns}</div>`;
  }

  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('nextBtn').textContent='下一题 →';
  document.getElementById('actionNext').classList.remove('show');
  document.getElementById('actionBar').classList.remove('has-next');
  updateProgress();saveState();
}

function answerDE_CN(selected,idx){
  if(answered||!quizActive)return;
  answered=true;total++;
  const correctAns=currentWord.cn;
  const btns=document.querySelectorAll('.option');
  btns.forEach(b=>{if(b.textContent===correctAns)b.classList.add('correct');else b.classList.add('wrong')});
  const isOk=selected===correctAns;
  if(isOk){score++;correct++;streak++;if(streak>maxStreak)maxStreak=streak}
  else streak=0;
  addHistory('de-cn',currentWord.de,selected,correctAns,isOk);
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(isOk?'correct':'wrong');
  fb.textContent=isOk?`✓ 正确！${streak>1?' 🔥连击 ×'+streak:''}`:`✗ 答案是：${correctAns}`;
  document.getElementById('actionNext').classList.add('show');
  document.getElementById('actionBar').classList.add('has-next');
  updateStats();updateProgress();saveState();
}

function answerCN_DE(selected,idx){
  if(answered||!quizActive)return;
  answered=true;total++;
  const correctClean=cleanDEWord(currentWord.de);
  const btns=document.querySelectorAll('.option');
  btns.forEach((b,i)=>{if(currentOptions[i]===correctClean)b.classList.add('correct');else b.classList.add('wrong')});
  const isOk=selected===correctClean;
  if(isOk){score++;correct++;streak++;if(streak>maxStreak)maxStreak=streak}
  else streak=0;
  addHistory('cn-de',currentWord.cn,selected,currentWord.de,isOk);
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(isOk?'correct':'wrong');
  fb.textContent=isOk?`✓ 正确！${currentWord.de}${streak>1?' 🔥连击 ×'+streak:''}`:`✗ 正确答案：${currentWord.de}`;
  document.getElementById('actionNext').classList.add('show');
  document.getElementById('actionBar').classList.add('has-next');
  updateStats();updateProgress();saveState();
}

function answerArticle(guess){
  if(answered||!quizActive)return;
  answered=true;total++;
  const correctArt=currentWord.article;
  const btns=document.querySelectorAll('.option');
  btns.forEach(b=>{if(b.textContent===correctArt)b.classList.add('correct');else b.classList.add('wrong')});
  const isOk=guess===correctArt;
  if(isOk){score++;correct++;streak++;if(streak>maxStreak)maxStreak=streak}
  else streak=0;
  addHistory('article',currentWord.de,guess,correctArt,isOk);
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(isOk?'correct':'wrong');
  fb.textContent=isOk?`✓ ${correctArt} 正确！${streak>1?' 🔥×'+streak:''}`:`✗ 应该是 ${correctArt}`;
  document.getElementById('actionNext').classList.add('show');
  document.getElementById('actionBar').classList.add('has-next');
  updateStats();updateProgress();saveState();
}

function updateStats(){
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('total').textContent=total;
  document.getElementById('accuracy').textContent=total>0?Math.round(correct/total*100)+'%':'—';
  // Brief pulse on score change
  const se=document.getElementById('score');
  se.style.transform='scale(1.4)';se.style.transition='transform .15s ease';
  setTimeout(()=>se.style.transform='scale(1)',150);
  if(streak>1){
    const st=document.getElementById('streak');
    st.style.transform='scale(1.3)';st.style.transition='transform .15s ease';
    setTimeout(()=>st.style.transform='scale(1)',150);
  }
}

function nextQuestion(){newQuestion()}

function toggleMode(m){
  if(!quizActive)return;
  if(activeModes.has(m))activeModes.delete(m);else activeModes.add(m);
  if(activeModes.size===0){activeModes.add(m)}
  const modeLabels={'de-cn':'DE → CN','cn-de':'CN → DE','article':'冠词'};
  const modeClass={'de-cn':'mode-dec','cn-de':'mode-cnd','article':'mode-art'};
  document.querySelectorAll('.tab').forEach(t=>{
    const label=t.textContent.trim();
    for(const[k,v]of Object.entries(modeLabels)){
      if(label.includes(v)){
        const isActive=activeModes.has(k);
        t.classList.toggle('active',isActive);
        t.classList.toggle(modeClass[k],isActive);
        break;
      }
    }
  });
  updateProgress();saveState();
  newQuestion();
}

function pickMode(){const arr=[...activeModes];return arr[Math.floor(Math.random()*arr.length)]}

function toggleModule(m){
  if(!quizActive)return;
  if(activeModules.has(m))activeModules.delete(m);else activeModules.add(m);
  if(activeModules.size===0){activeModules.add(m)}
  renderModules();updateProgress();saveState();
  newQuestion();
}

// ===== END QUIZ & RESULTS =====
function endQuiz(){
  if(total===0){document.getElementById('endBtnText').textContent='请先答题';setTimeout(()=>document.getElementById('endBtnText').textContent='🏅 看结果',1500);return;}
  quizActive=false;
  document.getElementById('quizSection').classList.add('hidden');
  document.getElementById('actionBar').style.display='none';
  document.getElementById('resultsWrap').classList.add('active');
  showResults();saveState();
  window.scrollTo({top:0,behavior:'smooth'});
}

function showResults(){
  const pct=Math.round(correct/total*100);
  let icon,emoji;
  if(pct>=90){icon='🏆';emoji='Ausgezeichnet! 太棒了！'}
  else if(pct>=70){icon='🌟';emoji='Gut gemacht! 不错！'}
  else if(pct>=50){icon='💪';emoji='Weiter so! 继续加油！'}
  else{icon='📚';emoji='Übung macht den Meister! 熟能生巧！'}

  document.getElementById('resultIcon').textContent=icon;
  document.getElementById('resultPercent').textContent=pct+'%';
  document.getElementById('resultDetail').textContent=emoji;
  document.getElementById('rScore').textContent=score;
  document.getElementById('rCorrect').textContent=correct+'/'+total;
  document.getElementById('rStreak').textContent=maxStreak;
  document.getElementById('rTotal').textContent=total;

  const wrongCount=history.filter(h=>!h.isCorrect).length;
  document.getElementById('btnRetryWrong').style.display=wrongCount>0?'':'none';

  renderHistory('all');
}

function renderHistory(filter){
  let items=filter==='wrong'?history.filter(h=>!h.isCorrect):history;
  const modeIcon={'de-cn':'📖','cn-de':'✍️','article':'📋'};
  const modeName={'de-cn':'DE→CN','cn-de':'CN→DE','article':'冠词'};
  const html=items.map((h,i)=>{
    const icon=modeIcon[h.mode]||'❓';
    const cls=h.isCorrect?'correct':'wrong';
    const mark=h.isCorrect?'✅':'❌';
    const idx=filter==='wrong'?(history.filter(x=>!x.isCorrect).indexOf(h)+1):(i+1);
    let ansCls=h.isCorrect?'':' wrong-ans';
    let detail='';
    if(!h.isCorrect) detail=`<span class="h-correct">→ ${h.correctAns}</span>`;
    else detail=`<span class="h-correct">✓</span>`;
    return `<div class="history-item ${cls}">
      <div class="h-head">
        <span class="h-num">#${idx} ${icon} ${modeName[h.mode]}</span>
        <span class="h-mark">${mark}</span>
      </div>
      <div class="h-word">${h.word}</div>
      <div class="h-meta">
        <span class="h-label">回答</span>
        <span class="h-answer${ansCls}">${h.userAns}</span>
        ${detail}
      </div>
    </div>`;
  }).join('');
  document.getElementById('historyList').innerHTML=html||'<div style="text-align:center;color:var(--text2);padding:20px">没有记录</div>';
}

function filterHistory(type){
  document.querySelectorAll('.review-filter button[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===type));
  renderHistory(type);
}

function retryWrong(){
  const wrongWords=history.filter(h=>!h.isCorrect);
  if(wrongWords.length===0){
    document.getElementById('btnRetryWrong').textContent='🎉 没有错题了！';
    setTimeout(()=>document.getElementById('btnRetryWrong').textContent='🔄 只练错题',1500);
    return;
  }
  retryPool=[];
  wrongWords.forEach(h=>{
    const v=vocab.find(v=>v.de===h.word||v.cn===h.word);
    if(v&&!retryPool.some(r=>r.de===v.de&&r.cn===v.cn)) retryPool.push(v);
  });
  if(retryPool.length===0){retryPool=null;restartQuiz();return}
  clearState();
  document.getElementById('retryBadge').style.display='inline';
  document.getElementById('resultsWrap').classList.remove('active');
  transitionToQuiz();
}

function restartQuiz(){
  clearState();retryPool=null;
  document.getElementById('retryBadge').style.display='none';
  resetState();
  document.getElementById('resultsWrap').classList.remove('active');
  transitionToQuiz();
}

function transitionToQuiz(){
  window.scrollTo({top:0,behavior:'smooth'});
  const qs=document.getElementById('quizSection');
  qs.classList.remove('hidden');
  qs.style.animation='none';
  qs.offsetHeight;
  qs.style.animation='slideUp .3s ease';
  document.getElementById('actionBar').style.display='flex';
  document.getElementById('actionNext').classList.remove('show');
  document.getElementById('actionBar').classList.remove('has-next');
  newQuestion();
  setTimeout(()=>qs.style.animation='',300);
}

function resetState(){
  quizActive=true;
  score=0;streak=0;maxStreak=0;total=0;correct=0;history=[];
  seenSet.clear();
  updateStats();
}

// ===== INIT =====

renderModules();
const wasResults=loadState();
updateProgress();
if(wasResults){
  quizActive=false;
  showResults();
  document.getElementById('quizSection').classList.add('hidden');
  document.getElementById('resultsWrap').classList.add('active');
  document.getElementById('actionBar').style.display='none';
}else{
  newQuestion();
}

// Keyboard: Enter to advance after answering
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.getElementById('actionNext').classList.contains('show')) nextQuestion();
    else if(document.getElementById('resultsWrap').classList.contains('active')) restartQuiz();
  }
});
</script>
