<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme:dark)">
<title>Deutsch Vokabeln Quiz</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f5;--surface:#fff;--text:#1a1a1a;--text2:#666;--accent:#2563eb;--accent2:#1d4ed8;--danger:#dc2626;--success:#16a34a;--border:#e5e5e5;--shadow:0 1px 3px rgba(0,0,0,.08);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','HarmonyOS Sans','Noto Sans SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
.container{max-width:640px;margin:0 auto;padding:12px 16px calc(24px + var(--safe-bottom))}
header{text-align:center;padding:20px 0 6px}
header h1{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:700;letter-spacing:-.01em}
header p{color:var(--text2);font-size:clamp(.75rem,3vw,.875rem);margin-top:2px}

.section-label{font-size:clamp(.68rem,2.5vw,.75rem);color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;padding-left:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);font-size:clamp(.7rem,2.8vw,.78rem);cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s;min-height:40px;display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;text-align:center}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.card{background:var(--surface);border-radius:16px;padding:clamp(16px,4vw,28px);box-shadow:var(--shadow)}
.module-select{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.module-tag{padding:8px 14px;border-radius:20px;border:1px solid var(--border);font-size:clamp(.7rem,2.8vw,.78rem);cursor:pointer;background:var(--surface);color:var(--text2);transition:all .15s;min-height:40px;display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.module-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.question-label{font-size:clamp(.7rem,2.5vw,.78rem);color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.question-word{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:700;margin:8px 0;line-height:1.3;word-break:break-word}
.question-hint{font-size:clamp(.75rem,2.8vw,.85rem);color:var(--text2);margin-bottom:14px}
.question-hint em{color:var(--accent);font-style:normal}

.options{display:flex;flex-direction:column;gap:8px}
.option{width:100%;padding:14px 16px;border-radius:10px;border:2px solid var(--border);background:var(--surface);text-align:left;font-size:clamp(.9rem,4vw,1.05rem);cursor:pointer;transition:all .15s;min-height:50px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;line-height:1.4}
.option:active{transform:scale(.98)}
@media(hover:hover){.option:hover{border-color:var(--accent)}}
.option.correct{border-color:var(--success);background:#f0fdf4}
.option.wrong{border-color:var(--danger);background:#fef2f2}

.fill-input{width:100%;padding:14px 16px;border-radius:10px;border:2px solid var(--border);font-size:clamp(1rem,4.5vw,1.2rem);outline:none;transition:border-color .15s;min-height:50px;-webkit-appearance:none;appearance:none;background:var(--surface);color:var(--text)}
.fill-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.fill-input.correct{border-color:var(--success);background:#f0fdf4}
.fill-input.wrong{border-color:var(--danger);background:#fef2f2}

.submit-btn{width:100%;margin-top:12px;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:clamp(.95rem,4vw,1.05rem);font-weight:600;cursor:pointer;transition:all .15s;min-height:50px;-webkit-tap-highlight-color:transparent}
.submit-btn:active{transform:scale(.98);background:var(--accent2)}
@media(hover:hover){.submit-btn:hover{background:var(--accent2)}}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none}

.feedback{margin-top:12px;padding:14px;border-radius:10px;font-size:clamp(.85rem,3.5vw,.95rem);text-align:center;display:none;font-weight:500}
.feedback.show{display:block}
.feedback.correct{background:#f0fdf4;color:var(--success)}
.feedback.wrong{background:#fef2f2;color:var(--danger)}

.next-btn{display:none;width:100%;margin-top:8px;padding:14px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:clamp(.95rem,4vw,1.05rem);font-weight:600;cursor:pointer;min-height:50px;-webkit-tap-highlight-color:transparent}
.next-btn.show{display:block}
.next-btn:active{background:rgba(37,99,235,.08)}

.stats{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.stat{text-align:center;min-width:56px}
.stat-value{font-size:clamp(1.2rem,5vw,1.6rem);font-weight:700}
.stat-label{font-size:clamp(.62rem,2.2vw,.7rem);color:var(--text2);text-transform:uppercase}
.stat-value.streak{color:#f59e0b}

@media(prefers-color-scheme:dark){
:root{--bg:#111;--surface:#1c1c1c;--text:#eee;--text2:#999;--border:#333;--shadow:0 1px 3px rgba(0,0,0,.3)}
.option.correct{background:#0a2e1a}
.option.wrong{background:#2e0a0a}
.fill-input{color-scheme:dark}
.fill-input.correct{background:#0a2e1a}
.fill-input.wrong{background:#2e0a0a}
.feedback.correct{background:#0a2e1a}
.feedback.wrong{background:#2e0a0a}
}

/* iPhone notch / Dynamic Island / Huawei punch-hole safe areas */
@supports(padding-top:env(safe-area-inset-top)){
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
}

/* Larger screens - subtle max-width centering */
@media(min-width:768px){
.container{padding:16px 24px 32px}
.card{padding:28px 32px}
}

/* Small phones (iPhone SE, etc) */
@media(max-width:374px){
.tab{font-size:.68rem;padding:8px 4px}
.stats{gap:4px}
.stat{min-width:44px}
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>🇩🇪 Deutsch Vokabeln</h1>
  <p>新经典德语2 · 词汇测验</p>
</header>

<div class="stats">
  <div class="stat"><div class="stat-value" id="score">0</div><div class="stat-label">得分</div></div>
  <div class="stat"><div class="stat-value streak" id="streak">0</div><div class="stat-label">连击</div></div>
  <div class="stat"><div class="stat-value" id="total">0</div><div class="stat-label">总题</div></div>
  <div class="stat"><div class="stat-value" id="accuracy">—</div><div class="stat-label">正确率</div></div>
</div>

<div class="section-label">题型（可多选）</div>
<div class="tabs">
  <button class="tab active" onclick="toggleMode('de-cn')">DE → CN 选择</button>
  <button class="tab active" onclick="toggleMode('cn-de')">CN → DE 填空</button>
  <button class="tab active" onclick="toggleMode('article')">冠词判断</button>
</div>

<div class="section-label">模块（可多选）</div>

<div class="card">
  <div class="module-select" id="moduleSelect"></div>
  <div class="question-label" id="qLabel">选择正确的中文释义</div>
  <div class="question-word" id="qWord">—</div>
  <div class="question-hint" id="qHint"></div>
  <div id="answerArea"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
</div>
</div>

// ===== STATE =====
let currentMode = null;
let currentWord = null;
let currentOptions = [];
let answered = false;
let activeModes = new Set(['de-cn','cn-de','article']);
let activeModules = new Set([1,2,3,4]);
let score = 0, streak = 0, total = 0, correct = 0;

// ===== HELPERS =====
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function getPool(){
  return vocab.filter(v=>activeModules.has(v.module) && (currentMode!=='article' || v.article));
}

function pickWrongs(correctWord, n=3){
  const pool = getPool().filter(v=>v.cn!==correctWord.cn);
  const picked = [];
  const used = new Set();
  while(picked.length<n && picked.length<pool.length){
    const r = pool[Math.floor(Math.random()*pool.length)];
    if(!used.has(r.cn)){used.add(r.cn);picked.push(r.cn)}
  }
  return picked;
}

// ===== RENDER =====
function renderModules(){
  const el = document.getElementById('moduleSelect');
  el.innerHTML = [1,2,3,4].map(m=>{
    const names = {1:'家庭与社会',2:'自然与文化',3:'教育与职业',4:'人与沟通'};
    const cls = activeModules.has(m)?'active':'';
    return `<button class="module-tag ${cls}" onclick="toggleModule(${m})">M${m} ${names[m]}</button>`;
  }).join('');
}

function newQuestion(){
  answered = false;
  currentMode = pickMode();
  const pool = getPool();
  if(pool.length===0){
    document.getElementById('qWord').textContent='请至少选择一个模块';
    document.getElementById('answerArea').innerHTML='';
    return;
  }
  currentWord = pool[Math.floor(Math.random()*pool.length)];

  if(currentMode==='de-cn'){
    document.getElementById('qLabel').textContent='选择正确的中文释义';
    document.getElementById('qWord').textContent=currentWord.de;
    document.getElementById('qHint').textContent='';
    const wrongs = pickWrongs(currentWord);
    currentOptions = shuffle([currentWord.cn, ...wrongs.slice(0,3)]);
    document.getElementById('answerArea').innerHTML = currentOptions.map((o,i)=>
      `<button class="option" onclick="answerDE_CN('${o.replace(/'/g,"\\'")}', ${i})">${o}</button>`
    ).join('');
  } else if(currentMode==='cn-de'){
    document.getElementById('qLabel').textContent='输入对应的德语单词/短语';
    document.getElementById('qWord').textContent=currentWord.cn;
    document.getElementById('qHint').innerHTML='直接输入核心词即可，不用冠词和 sich，如 <em>Haus</em> 或 <em>unterstützen</em>';
    document.getElementById('answerArea').innerHTML = `
      <input class="fill-input" id="fillInput" placeholder="输入德语..." autocomplete="off" onkeydown="if(event.key==='Enter')answerCN_DE()">
      <button class="submit-btn" onclick="answerCN_DE()">确认 ✓</button>`;
  } else if(currentMode==='article'){
    document.getElementById('qLabel').textContent='这个词的冠词是？';
    document.getElementById('qWord').textContent=currentWord.de;
    document.getElementById('qHint').textContent='选择 der / die / das';
    document.getElementById('answerArea').innerHTML = ['der','die','das'].map(a=>
      `<button class="option" onclick="answerArticle('${a}')">${a}</button>`
    ).join('');
  }

  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('nextBtn').textContent='下一题 →';
}

function answerDE_CN(selected, idx){
  if(answered)return;
  answered=true;total++;
  const correctAns = currentWord.cn;
  const btns = document.querySelectorAll('.option');
  btns.forEach(b=>{
    if(b.textContent===correctAns)b.classList.add('correct');
    else b.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  if(selected===correctAns){
    score++;correct++;streak++;
    fb.className='feedback show correct';
    fb.textContent=`✓ 正确！${streak>1?' 🔥连击 ×'+streak:''}`;
  } else {
    streak=0;
    fb.className='feedback show wrong';
    fb.textContent=`✗ 答案是：${correctAns}`;
  }
  document.getElementById('nextBtn').className='next-btn show';
  updateStats();
}

function answerCN_DE(){
  if(answered)return;
  const input = document.getElementById('fillInput');
  if(!input||!input.value.trim())return;
  answered=true;total++;
  const userAns = input.value.trim().toLowerCase();
  // Strip article, annotations, plural markers, and "sich" — order matters
  let correctAns = currentWord.de
    .replace(/\([^)]*\)/g,'')   // strip parenthesized notes like (+A) — do this first
    .replace(/^((der|die|das)\s+)/i,'')
    .replace(/\s*\+\w.*$/,'')
    .replace(/\s*-[a-zäöüß]+.*$/,'')
    .replace(/\s*¨.*$/,'')
    .replace(/^sich\s+/i,'')
    .trim().toLowerCase();

  // Normalize: collapse spaces, remove any leftover annotation artifacts
  const normalize = s => s.replace(/\s+/g,' ').replace(/[\-+()]/g,'').trim();
  const normUser = normalize(userAns);
  const normCorrect = normalize(correctAns);

  // Exact match after normalization
  let isCorrect = normUser === normCorrect;

  // Fuzzy: core letters match (for minor spelling variations)
  if(!isCorrect){
    const core = normCorrect.replace(/\s+/g,'');
    const userCore = normUser.replace(/\s+/g,'');
    isCorrect = userCore===core;
  }

  // Loose: user input ≥60% of correct answer length and is contained (catch partial answers)
  if(!isCorrect && normUser.length>=3 && normCorrect.includes(normUser) && normUser.length/normCorrect.length>=0.6){
    isCorrect = true;
  }

  if(isCorrect){
    input.className='fill-input correct';
    score++;correct++;streak++;
    document.getElementById('feedback').className='feedback show correct';
    document.getElementById('feedback').textContent=`✓ 正确！${streak>1?' 🔥连击 ×'+streak:''}（${currentWord.de}）`;
  } else {
    input.className='fill-input wrong';
    streak=0;
    document.getElementById('feedback').className='feedback show wrong';
    document.getElementById('feedback').textContent=`✗ 答案是：${currentWord.de}`;
  }
  document.getElementById('nextBtn').className='next-btn show';
  updateStats();
}

function answerArticle(guess){
  if(answered)return;
  answered=true;total++;
  const correctArt = currentWord.article;
  const btns = document.querySelectorAll('.option');
  btns.forEach(b=>{
    if(b.textContent===correctArt)b.classList.add('correct');
    else b.classList.add('wrong');
  });
  const fb = document.getElementById('feedback');
  if(guess===correctArt){
    score++;correct++;streak++;
    fb.className='feedback show correct';
    fb.textContent=`✓ ${correctArt} 正确！${streak>1?' 🔥×'+streak:''}`;
  } else {
    streak=0;
    fb.className='feedback show wrong';
    fb.textContent=`✗ 应该是 ${correctArt}`;
  }
  document.getElementById('nextBtn').className='next-btn show';
  updateStats();
}

function updateStats(){
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('total').textContent=total;
  document.getElementById('accuracy').textContent=total>0?Math.round(correct/total*100)+'%':'—';
}

function nextQuestion(){
  newQuestion();
  if(currentMode==='cn-de') setTimeout(()=>document.getElementById('fillInput')?.focus(), 100);
}

function toggleMode(m){
  if(activeModes.has(m))activeModes.delete(m);else activeModes.add(m);
  if(activeModes.size===0){activeModes.add(m)}
  // Update button visuals
  const modeLabels = {'de-cn':'DE → CN','cn-de':'CN → DE','article':'冠词'};
  document.querySelectorAll('.tab').forEach(t=>{
    const label = t.textContent.trim();
    for(const [key,val] of Object.entries(modeLabels)){
      if(label.includes(val)){t.classList.toggle('active',activeModes.has(key));break}
    }
  });
  newQuestion();
}

function pickMode(){
  const arr = [...activeModes];
  return arr[Math.floor(Math.random()*arr.length)];
}

function toggleModule(m){
  if(activeModules.has(m))activeModules.delete(m);else activeModules.add(m);
  if(activeModules.size===0){activeModules.add(m)}
  renderModules();
  newQuestion();
}

// ===== INIT =====
renderModules();
newQuestion();
</script>
